<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
<style>
  text { font-family: 'TT Commons', 'TT Commons Pro', 'Helvetica Neue', Arial, sans-serif; }
  .ci { stroke: #2C3B4D; stroke-width: 2; opacity: 0.5; }
  .lbl { font-size: 13px; font-weight: 600; fill: #1B2632; }
  .axis { font-size: 13px; fill: #2C3B4D; }
  .val { font-size: 13px; fill: #1B2632; }
</style>

<!-- Background: white -->

<!-- Title -->
<text x="40" y="44" font-size="22" font-weight="700" fill="#1B2632">Enabler Maturity — Ω with confidence intervals</text>
<text x="40" y="80" font-size="13" fill="#2C3B4D">Seven enablers, ranked · dot = provisional Ω, bar = confidence interval (wider = less certain)</text>

<!-- Level bands (Oatmeal tint / Palladian) -->
<rect x="258.0" y="122" width="52.8" height="288" fill="#C9C1B1" fill-opacity="0.35"/>
<rect x="310.8" y="122" width="105.5" height="288" fill="#FFFFFF"/>
<rect x="416.3" y="122" width="105.5" height="288" fill="#C9C1B1" fill-opacity="0.35"/>
<rect x="521.8" y="122" width="105.5" height="288" fill="#FFFFFF"/>
<rect x="627.3" y="122" width="52.8" height="288" fill="#C9C1B1" fill-opacity="0.35"/>

<!-- Gridlines + axis labels -->
<g stroke="#C9C1B1" stroke-width="1">
  <line x1="258.0" y1="122" x2="258.0" y2="410"/>
  <line x1="363.5" y1="122" x2="363.5" y2="410"/>
  <line x1="469.0" y1="122" x2="469.0" y2="410"/>
  <line x1="574.5" y1="122" x2="574.5" y2="410"/>
  <line x1="680.0" y1="122" x2="680.0" y2="410"/>
</g>
<text x="258.0" y="112" text-anchor="middle" class="axis">1·Ad hoc</text>
<text x="363.5" y="112" text-anchor="middle" class="axis">2·Emerging</text>
<text x="469.0" y="112" text-anchor="middle" class="axis">3·Defined</text>
<text x="574.5" y="112" text-anchor="middle" class="axis">4·Managed</text>
<text x="680.0" y="112" text-anchor="middle" class="axis">5·Leading</text>

<!-- "Defined" benchmark: Burning Flame -->
<line x1="469.0" y1="122" x2="469.0" y2="410" stroke="#FFB162" stroke-width="2" stroke-dasharray="5 4"/>

<!-- Row 1: Structure & Governance — 3.0, Very high -->
<text x="244" y="132.5" text-anchor="end" class="lbl">Structure &amp; Governance</text>
<line x1="395.1" y1="128" x2="542.9" y2="128" class="ci"/>
<line x1="395.1" y1="123" x2="395.1" y2="133" class="ci"/>
<line x1="542.9" y1="123" x2="542.9" y2="133" class="ci"/>
<circle cx="469.0" cy="128" r="6.5" fill="#1B2632" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="132.5" class="val"><tspan font-weight="700">3.0</tspan><tspan fill="#2C3B4D">  · Very high</tspan></text>

<!-- Row 2: Strategy & Portfolio — 3.0, High -->
<text x="244" y="177.5" text-anchor="end" class="lbl">Strategy &amp; Portfolio</text>
<line x1="416.3" y1="173" x2="521.8" y2="173" class="ci"/>
<line x1="416.3" y1="168" x2="416.3" y2="178" class="ci"/>
<line x1="521.8" y1="168" x2="521.8" y2="178" class="ci"/>
<circle cx="469.0" cy="173" r="6.5" fill="#A35139" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="177.5" class="val"><tspan font-weight="700">3.0</tspan><tspan fill="#2C3B4D">  · High</tspan></text>

<!-- Row 3: Leadership & Decision-making — 2.8, Very high -->
<text x="244" y="222.5" text-anchor="end" class="lbl">Leadership &amp; Decision-making</text>
<line x1="416.3" y1="218" x2="479.6" y2="218" class="ci"/>
<line x1="416.3" y1="213" x2="416.3" y2="223" class="ci"/>
<line x1="479.6" y1="213" x2="479.6" y2="223" class="ci"/>
<circle cx="447.9" cy="218" r="6.5" fill="#1B2632" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="222.5" class="val"><tspan font-weight="700">2.8</tspan><tspan fill="#2C3B4D">  · Very high</tspan></text>

<!-- Row 4: Delivery Operating System — 2.3, Very high -->
<text x="244" y="267.5" text-anchor="end" class="lbl">Delivery Operating System</text>
<line x1="363.5" y1="263" x2="426.8" y2="263" class="ci"/>
<line x1="363.5" y1="258" x2="363.5" y2="268" class="ci"/>
<line x1="426.8" y1="258" x2="426.8" y2="268" class="ci"/>
<circle cx="395.1" cy="263" r="6.5" fill="#1B2632" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="267.5" class="val"><tspan font-weight="700">2.3</tspan><tspan fill="#2C3B4D">  · Very high</tspan></text>

<!-- Row 5: Capabilities & Competency — 2.3, High -->
<text x="244" y="312.5" text-anchor="end" class="lbl">Capabilities &amp; Competency</text>
<line x1="352.9" y1="308" x2="437.4" y2="308" class="ci"/>
<line x1="352.9" y1="303" x2="352.9" y2="313" class="ci"/>
<line x1="437.4" y1="303" x2="437.4" y2="313" class="ci"/>
<circle cx="395.1" cy="308" r="6.5" fill="#A35139" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="312.5" class="val"><tspan font-weight="700">2.3</tspan><tspan fill="#2C3B4D">  · High</tspan></text>

<!-- Row 6: People & Capacity — 2.2, Very high -->
<text x="244" y="357.5" text-anchor="end" class="lbl">People &amp; Capacity</text>
<line x1="352.9" y1="353" x2="416.3" y2="353" class="ci"/>
<line x1="352.9" y1="348" x2="352.9" y2="358" class="ci"/>
<line x1="416.3" y1="348" x2="416.3" y2="358" class="ci"/>
<circle cx="384.6" cy="353" r="6.5" fill="#1B2632" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="702" y="357.5" class="val"><tspan font-weight="700">2.2</tspan><tspan fill="#2C3B4D">  · Very high</tspan></text>

<!-- Row 7: Engineering Culture — 1.8, Medium -->
<text x="244" y="402.5" text-anchor="end" class="lbl">Engineering Culture</text>
<line x1="279.1" y1="398" x2="416.3" y2="398" class="ci"/>
<line x1="279.1" y1="393" x2="279.1" y2="403" class="ci"/>
<line x1="416.3" y1="393" x2="416.3" y2="403" class="ci"/>
<circle cx="342.4" cy="398" r="6.5" fill="#FFB162" stroke="#A35139" stroke-width="1.5"/>
<text x="702" y="402.5" class="val"><tspan font-weight="700">1.8</tspan><tspan fill="#2C3B4D">  · Medium</tspan></text>

<!-- Legend -->
<g transform="translate(258,442)">
  <circle cx="6" cy="-4" r="6" fill="#1B2632"/>
  <text x="18" y="0" class="val">Very high confidence</text>
  <circle cx="190" cy="-4" r="6" fill="#A35139"/>
  <text x="202" y="0" class="val">High</text>
  <circle cx="262" cy="-4" r="6" fill="#FFB162" stroke="#A35139" stroke-width="1.5"/>
  <text x="274" y="0" class="val">Medium</text>
  <line x1="360" y1="-4" x2="384" y2="-4" stroke="#FFB162" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="392" y="0" class="val">“Defined” benchmark (3.0)</text>
</g>
</svg>
