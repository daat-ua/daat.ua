<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700">
<style>
  text { font-family: 'TT Commons', 'TT Commons Pro', 'Helvetica Neue', Arial, sans-serif; }
  .grid { fill: none; stroke: #C9C1B1; stroke-width: 1; }
  .spoke { stroke: #C9C1B1; stroke-width: 1; }
  .ring { font-size: 12px; fill: #2C3B4D; }
  .axis { font-size: 13px; font-weight: 600; fill: #1B2632; }
  .score { font-size: 13px; font-weight: 700; fill: #2C3B4D; }
  .vertex { fill: #FFB162; stroke: #1B2632; stroke-width: 1.5; }
  .val { font-size: 13px; fill: #1B2632; }
  .note { font-size: 12px; fill: #2C3B4D; }
</style>

<!-- Background: white -->

<!-- Title -->
<text x="40" y="46" font-size="22" font-weight="700" fill="#1B2632">RADAR-IT — Company-Wide Profile</text>
<text x="40" y="82" font-size="13" fill="#2C3B4D">Accumulated across the CEO, CFO, Head of Delivery, MARS and CTO interviews</text>

<!-- Grid rings (1–5) -->
<polygon points="430.0,346.0 469.9,375.0 454.7,422.0 405.3,422.0 390.1,375.0" class="grid"/>
<polygon points="430.0,304.0 509.9,362.0 479.4,456.0 380.6,456.0 350.1,362.0" class="grid"/>
<polygon points="430.0,262.0 549.8,349.1 504.1,489.9 355.9,489.9 310.2,349.1" class="grid"/>
<polygon points="430.0,220.0 589.8,336.1 528.7,523.9 331.3,523.9 270.2,336.1" class="grid"/>
<polygon points="430.0,178.0 629.7,323.1 553.4,557.9 306.6,557.9 230.3,323.1" class="grid"/>

<!-- Spokes -->
<line x1="430" y1="388" x2="430.0" y2="178.0" class="spoke"/>
<line x1="430" y1="388" x2="629.7" y2="323.1" class="spoke"/>
<line x1="430" y1="388" x2="553.4" y2="557.9" class="spoke"/>
<line x1="430" y1="388" x2="306.6" y2="557.9" class="spoke"/>
<line x1="430" y1="388" x2="230.3" y2="323.1" class="spoke"/>

<!-- Ring labels -->
<text x="437" y="350.0" class="ring">1</text>
<text x="437" y="308.0" class="ring">2</text>
<text x="437" y="266.0" class="ring">3</text>
<text x="437" y="224.0" class="ring">4</text>
<text x="437" y="182.0" class="ring">5</text>

<!-- "Defined" benchmark (3.0): Burning Flame -->
<polygon points="430.0,262.0 549.8,349.1 504.1,489.9 355.9,489.9 310.2,349.1" fill="none" stroke="#FFB162" stroke-width="2" stroke-dasharray="5 4"/>

<!-- Company profile: Blue Fantastic -->
<polygon points="430.0,283.0 589.8,336.1 474.4,449.2 355.9,489.9 350.1,362.0" fill="#2C3B4D" fill-opacity="0.16" stroke="#2C3B4D" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="430.0" cy="283.0" r="5" class="vertex"/>
<circle cx="589.8" cy="336.1" r="5" class="vertex"/>
<circle cx="474.4" cy="449.2" r="5" class="vertex"/>
<circle cx="355.9" cy="489.9" r="5" class="vertex"/>
<circle cx="350.1" cy="362.0" r="5" class="vertex"/>

<!-- Axis labels + scores -->
<text x="430.0" y="148.0" text-anchor="middle" class="axis">Results</text>
<text x="430.0" y="164.5" text-anchor="middle" class="score">2.5</text>

<text x="658.3" y="313.8" text-anchor="start" class="axis">Approach</text>
<text x="658.3" y="330.3" text-anchor="start" class="score">4.0</text>

<text x="571.1" y="588.2" text-anchor="start" class="axis">Deployment</text>
<text x="571.1" y="604.7" text-anchor="start" class="score">1.8</text>

<text x="288.9" y="588.2" text-anchor="end" class="axis">Assessment</text>
<text x="288.9" y="604.7" text-anchor="end" class="score">3.0</text>

<text x="201.7" y="313.8" text-anchor="end" class="axis">Risk control</text>
<text x="201.7" y="330.3" text-anchor="end" class="score">2.0</text>

<!-- Legend -->
<g transform="translate(40,628)">
  <rect x="0" y="-10" width="14" height="14" rx="2" fill="#2C3B4D" fill-opacity="0.2" stroke="#2C3B4D" stroke-width="2"/>
  <text x="22" y="2" class="val">Company profile (0–5 maturity)</text>
  <line x1="250" y1="-3" x2="278" y2="-3" stroke="#FFB162" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="286" y="2" class="val">“Defined” Ω benchmark (3.0)</text>
</g>

<!-- Footnotes -->
<text x="40" y="660" class="note">Risk is plotted as risk control / posture (inverted from exposure), so a larger area is uniformly healthier.</text>
<text x="40" y="677" class="note">Provisional 0–5 scores accumulated across the five interviews; Deployment and Risk are the company’s weakest axes.</text>
</svg>
