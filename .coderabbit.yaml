# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings for the daat.ua / ATLAS landing page.
# Astro 7 + Tailwind 4 (src/), built as a static site and served by Caddy on Railway.

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false

  # Review the page and its docs; skip source material, fonts and generated media
  path_filters:
    - "!_source/**"
    - "!public/frames/**"
    - "!src/assets/fonts/**"
    - "!**/*.webp"
    - "!**/*.jpg"
    - "!**/*.png"
    - "!**/.DS_Store"
    - "!package-lock.json"
    - "!dist/**"
    - "!.astro/**"

  path_instructions:
    - path: "src/**"
      instructions: |
        Static Astro 7 + Tailwind 4 landing page in Ukrainian. Its look is checked against the original single-file page with `npm run test:visual`. Review with these project rules in mind:
        - Layout: desktop (>= 1024px) scales the 1440px design proportionally through `--px: calc(100vw / 1440)`; every desktop size is `calc(N * var(--px))`. One breakpoint only, 1024px (`desk`; phone rules in `@media (width < 64rem)` / Tailwind `max-desk:`), sets `--px: 1px` and the phone layout. Flag new breakpoints, clamps or fixed px sizes on desktop.
        - Tokens: use the existing custom properties (colours `--c-*`, type `--text-display/heading/title/lead/body/small`, spacing `--space-xs…3xl`, grid `--col`, `--col-gap`, `--span-2`, `--span-3`, `--gutter`). Flag font sizes outside the type scale and hard-coded colours that duplicate a token.
        - Accessibility: WCAG 2.1 AA contrast, visible focus states, keyboard support for tabs, accordions, carousels and the menu dialog, `aria-*` kept in sync by the scripts, and `prefers-reduced-motion` respected by every animation.
        - Motion: animate transform and opacity (or clip-path / grid rows) rather than layout properties; one-time and scroll-driven effects must not cause layout shift.
        - Copy: Ukrainian typography: `&nbsp;` before em dashes and inside short numeric phrases, the typographic apostrophe (’), no orphaned single-letter words at line ends where `nowrap` is used elsewhere.
        - Stacking inside `.toc-scope`: content sections z0 < floating TOC z1 < scrub clip z2 < hero z3 < header z4; flag z-index changes that break it.
        - Placeholders: links with `href="#"` and `TODO` comments are deliberate until content arrives; don't flag them unless a TODO looks forgotten in finished-looking work.
        - Static output only, no client framework; client JS lives in component `<script>` tags or src/scripts (TypeScript), bundled by Astro.
        - Component CSS is unlayered `<style is:global>` (Astro orders CSS chunks unpredictably, so don't rely on source order between components: make a value explicit where two equal-specificity rules meet); the base reset is in `@layer base`; Tailwind utilities are layered.
        - Images go through `astro:assets` (`<Image>`/`<Picture>`) with sensible `sizes`; the LCP image is eager/high priority, the rest lazy. Frame sequences for the canvases live in public/frames.
        - Fonts come from Astro's Fonts API (no hand-written `@font-face`).
        - Section components live in src/components/atlas-landing/sections; copy lives in src/data as typed data.
        - i18n: one locale, `uk-UA`, always in the URL (pages under src/pages/uk-UA/, no trailing slash, built as .html). Internal links to pages go through `getRelativeLocaleUrl(…, { normalizeLocale: false })` so the locale keeps its casing.
    - path: "{Dockerfile,Caddyfile,railway.json}"
      instructions: |
        Railway deployment: multi-stage build (Node 26 builds, Caddy serves dist/ on $PORT). Check caching headers (immutable for /_astro/*), compression, security headers and that the image stays small.
    - path: "FIGMA-DEVIATIONS.md"
      instructions: |
        Running log for the designer of every deviation from the Figma file. Check that a change to the page that alters layout, type, colour or copy against the design has a matching entry here, and that entries stay accurate (no notes about things since removed).
    - path: ".impeccable.md"
      instructions: |
        Design context (audience, tone, principles) used for design reviews. Only check that it stays consistent with the page.

chat:
  auto_reply: true
