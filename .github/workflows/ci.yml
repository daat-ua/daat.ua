name: CI

on:
  pull_request:
    # labeled/unlabeled: adding or removing `visual-change` re-runs the checks
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the visual check builds the PR's base branch from git history
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      # type-checked here, on every PR and push to main, so the deploy build (Dockerfile) only builds
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      # Only what a pull request changes on the ATLAS page: its build against its base branch's build. A PR that
      # changes the page on purpose gets the `visual-change` label, which skips this step (diffs stay reviewable
      # locally with `npm run test:visual -- --base-ref=origin/main`).
      - name: Visual check against the base branch
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-change')
        env:
          BASE_REF: ${{ github.base_ref }} # through the environment, never expanded into the script
        run: npm run test:visual -- --base-ref="origin/$BASE_REF" --widths=1440,500
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/output/
